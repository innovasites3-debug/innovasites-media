<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Oswald'; font-weight: 700; src: url('fonts/oswald-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Space Mono'; font-weight: 700; src: url('fonts/space-mono-latin-700-normal.woff2') format('woff2'); }
body{margin:0;width:1600px;height:1180px;background:radial-gradient(ellipse at 50% 40%,#1a0b0b,#07070a 70%);font-family:'Oswald';color:#fff}
h1{margin:30px 50px 0;font-size:50px;text-transform:uppercase}h1 span{color:#E5342A}
.g{display:flex;flex-wrap:wrap;gap:10px 6px;padding:10px 30px}
.c{width:246px;height:250px;position:relative;text-align:center}
.c .h{position:absolute;left:12px;top:0;transform:scale(.8);transform-origin:0 0}
.c p{position:absolute;left:0;right:0;bottom:0;font-family:'Space Mono';font-weight:700;font-size:15px;color:#c9ced8;text-transform:uppercase;letter-spacing:.08em;margin:0}
</style><script src="pixel.js"></script></head><body><h1>Pixel · <span>caras nuevas</span></h1><div class="g" id="g"></div>
<script>
const L=[[{},'Normal'],[{mouth:'talk'},'Hablando A'],[{mouth:'mid'},'Hablando B'],[{mouth:'ee',eyes:'happy'},'Hablando C'],[{mouth:'wide'},'Hablando D'],
[{eyes:'happy',mouth:'grin'},'Feliz'],[{eyes:'wide',mouth:'o'},'Sorpresa'],[{eyes:'angry',mouth:'frown'},'Enojado'],[{eyes:'sad',mouth:'frown'},'Triste'],
[{eyes:'sus',mouth:'smirk'},'Sospecha'],[{eyes:'think',mouth:'flat'},'Pensando'],[{eyes:'x',mouth:'zig'},'¡Peligro!'],[{eyes:'heart',mouth:'smile'},'Me gusta'],
[{eyes:'star',mouth:'grin'},'¡Genial!'],[{eyes:'wink',mouth:'smirk'},'Guiño'],[{dx:-1,mouth:'smile'},'Mira izq.'],[{dx:1,dy:1,mouth:'flat'},'Mira abajo'],
[{icon:'lock'},'Ícono candado'],[{icon:'warn'},'Ícono alerta'],[{icon:'check'},'Ícono check'],[{icon:'q'},'Ícono pregunta']];
L.forEach(([o,l])=>document.getElementById('g').insertAdjacentHTML('beforeend',`<div class="c"><div class="h">${pixelHead(o,11)}</div><p>${l}</p></div>`));
</script></body></html>
