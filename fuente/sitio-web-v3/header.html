<style>
  #iv3h {
    --bg: #0A0C11; --bg2: #11141B; --red: #E5342A; --red2: #FF5A45;
    --white: #fff; --muted: #A9AFBB; --line: rgba(255,255,255,.1);
    --disp: 'Oswald', sans-serif; --mono: 'Space Mono', monospace; --body: 'Inter', sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1); --ease-io: cubic-bezier(.76,0,.24,1);

  }
  #iv3h *, #iv3h *::before, #iv3h *::after { box-sizing: border-box; margin: 0; padding: 0; }
  #iv3h h1, #iv3h h2, #iv3h h3, #iv3h h4, #iv3h p, #iv3h span, #iv3h li, #iv3h strong, #iv3h b, #iv3h em, #iv3h small, #iv3h label, #iv3h legend, #iv3h blockquote { color: inherit; font-family: inherit; background: none; border: 0; text-shadow: none; }
  #iv3h a { color: inherit; text-decoration: none; }
  #iv3h button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  #iv3h .iv3h-skip { position: fixed; left: 16px; top: -80px; z-index: 1001; background: var(--red); color: #fff; padding: 12px 18px; font: 600 14px var(--body); transition: top .2s; }
  #iv3h .iv3h-skip:focus { top: 16px; }
  #iv3h .iv3h-bar { position: fixed; inset: 0 0 auto 0; z-index: 1000; transition: transform .5s var(--ease), background .4s, backdrop-filter .4s; }
  #iv3h .iv3h-bar.iv3h-solid { background: rgba(10,12,17,.95); }
  #iv3h .iv3h-bar.iv3h-hide { transform: translateY(-110%); }
  #iv3h .iv3h-row { max-width: 1440px; margin: 0 auto; padding: 18px clamp(16px, 4vw, 48px); display: flex; align-items: center; gap: 28px; }
  #iv3h .iv3h-logo { display: flex; align-items: center; gap: 10px; font: italic 700 22px/1 var(--disp); letter-spacing: .01em; }

  #iv3h .iv3h-nav { margin-left: auto; display: flex; gap: 4px; }
  #iv3h .iv3h-nav a { position: relative; padding: 10px 14px; font: 500 14px var(--body); color: var(--muted); transition: color .3s; overflow: hidden; }
  #iv3h .iv3h-nav a i { font: 400 10px var(--mono); color: var(--red2); margin-right: 6px; font-style: normal; }
  #iv3h .iv3h-nav a::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 4px; height: 2px; background: var(--red); transform: scaleX(0); transform-origin: right; transition: transform .45s var(--ease); }
  #iv3h .iv3h-nav a:hover, #iv3h .iv3h-nav a.iv3h-on { color: #fff; }
  #iv3h .iv3h-nav a:hover::after, #iv3h .iv3h-nav a.iv3h-on::after { transform: scaleX(1); transform-origin: left; }
  #iv3h .iv3h-cta { display: inline-flex; align-items: center; gap: 10px; padding: 13px 20px; background: var(--red); font: italic 600 15px/1 var(--disp); letter-spacing: .06em; text-transform: uppercase; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: background .3s; }
  #iv3h .iv3h-cta:hover { background: var(--red2); }
  #iv3h .iv3h-cta svg { width: 16px; height: 16px; transition: transform .3s var(--ease); }
  #iv3h .iv3h-cta:hover svg { transform: translateX(4px); }
  #iv3h .iv3h-prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--red); transform: scaleX(0); transform-origin: left; }
  #iv3h .iv3h-burger { display: none; width: 46px; height: 46px; margin-left: auto; position: relative; z-index: 2; }
  #iv3h .iv3h-burger span { position: absolute; left: 11px; right: 11px; height: 2px; background: #fff; transition: transform .45s var(--ease), opacity .3s, top .45s var(--ease); }
  #iv3h .iv3h-burger span:nth-child(1) { top: 16px; } #iv3h .iv3h-burger span:nth-child(2) { top: 22px; right: 19px; } #iv3h .iv3h-burger span:nth-child(3) { top: 28px; }
  #iv3h.iv3h-open .iv3h-burger span:nth-child(1) { top: 22px; transform: rotate(45deg); }
  #iv3h.iv3h-open .iv3h-burger span:nth-child(2) { opacity: 0; }
  #iv3h.iv3h-open .iv3h-burger span:nth-child(3) { top: 22px; transform: rotate(-45deg); }
  #iv3h .iv3h-menu { position: fixed; inset: 0; z-index: 999; background: var(--bg); display: flex; flex-direction: column; justify-content: center; padding: 100px clamp(20px, 6vw, 60px) 40px; clip-path: inset(0 0 100% 0); transition: clip-path .7s var(--ease-io); visibility: hidden; }
  #iv3h.iv3h-open .iv3h-menu { clip-path: inset(0 0 0 0); visibility: visible; }
  #iv3h .iv3h-menu::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 48px 48px; opacity: .5; pointer-events: none; }
  #iv3h .iv3h-big { position: relative; display: flex; align-items: baseline; gap: 16px; font: italic 700 clamp(44px, 12vw, 96px)/1.04 var(--disp); text-transform: uppercase; overflow: hidden; }
  #iv3h .iv3h-big span { display: inline-block; transform: translateY(105%); transition: transform .7s var(--ease); }
  #iv3h .iv3h-big i { font: 400 13px var(--mono); color: var(--red2); font-style: normal; }
  #iv3h.iv3h-open .iv3h-big span { transform: none; }
  #iv3h.iv3h-open .iv3h-big:nth-child(2) span { transition-delay: .25s; } #iv3h.iv3h-open .iv3h-big:nth-child(3) span { transition-delay: .31s; }
  #iv3h.iv3h-open .iv3h-big:nth-child(4) span { transition-delay: .37s; } #iv3h.iv3h-open .iv3h-big:nth-child(5) span { transition-delay: .43s; }
  #iv3h .iv3h-big:hover span { color: var(--red); }
  #iv3h .iv3h-mfoot { position: relative; margin-top: 44px; display: flex; flex-direction: column; gap: 8px; font: 400 14px var(--mono); color: var(--muted); }
  #iv3h .iv3h-mfoot a { color: #fff; }
  body.admin-bar #iv3h .iv3h-bar { top: 32px; }
  @media (max-width: 782px) { body.admin-bar #iv3h .iv3h-bar { top: 46px; } }
  @media (max-width: 900px) {
    #iv3h .iv3h-nav { display: none; }
    #iv3h .iv3h-row { gap: 10px; }
    #iv3h .iv3h-row > .iv3h-cta { margin-left: auto; padding: 10px 12px; font-size: 13px; letter-spacing: .05em; gap: 6px; }
    #iv3h .iv3h-row > .iv3h-cta svg { width: 13px; height: 13px; }
    #iv3h .iv3h-burger { display: block; margin-left: 0; }
    #iv3h .iv3h-row { padding-top: 10px; padding-bottom: 10px; }
    #iv3h .iv3h-logo { font-size: 19px; gap: 8px; }
    #iv3h .iv3h-logo img { width: 32px; height: 32px; }
  }
  @media (prefers-reduced-motion: reduce) { #iv3h *, #iv3h *::before, #iv3h *::after { transition-duration: .01ms !important; } }
</style>
