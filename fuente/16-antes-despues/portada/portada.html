<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Oswald';font-weight:700;src:url('../../../marca/pixel/fonts/oswald-latin-700-normal.woff2')}
@font-face{font-family:'Space Mono';font-weight:700;src:url('../../../marca/pixel/fonts/space-mono-latin-700-normal.woff2')}
*{box-sizing:border-box}
body{margin:0;width:1080px;height:1920px;overflow:hidden;position:relative;color:#fff;font-family:Oswald;
 background:radial-gradient(ellipse 90% 45% at 50% 62%,#4a0d0a 0%,#160505 45%,#050507 80%)}
#grid{position:absolute;left:-600px;right:-600px;top:1420px;height:900px;transform:perspective(500px) rotateX(62deg);transform-origin:50% 0;
 background-image:linear-gradient(#ff3b2f 3px,transparent 3px),linear-gradient(90deg,#ff3b2f 3px,transparent 3px);background-size:120px 120px;opacity:.5;-webkit-mask:linear-gradient(#000,transparent 85%)}
#hz{position:absolute;left:0;right:0;top:1412px;height:6px;background:#ff5a4f;box-shadow:0 0 40px 12px rgba(255,59,47,.6)}
.cube{position:absolute;background:#E5342A;box-shadow:0 0 18px #ff3b2f}.cube.w{background:#fff;opacity:.7}
#tag{position:absolute;top:300px;left:0;right:0;text-align:center;font:700 30px 'Space Mono';letter-spacing:.22em;color:#c9ced8}#tag b{color:#E5342A}
h1{position:absolute;top:350px;left:0;right:0;margin:0;text-align:center;font:700 176px/0.98 Oswald;text-transform:uppercase}
h1 .r{color:#ff3b2f;text-shadow:0 0 40px rgba(255,59,47,.55)}
#sub{position:absolute;top:740px;left:0;right:0;text-align:center;font:700 48px Oswald;text-transform:uppercase;letter-spacing:.04em}
#sub span{background:#E5342A;padding:4px 20px}
.shot{position:absolute;width:560px;border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.7)}
#a{left:30px;top:870px;transform:rotate(-6deg);filter:saturate(.6) brightness(.85)}
#b{left:480px;top:930px;transform:rotate(4deg);box-shadow:0 0 0 6px #ff3b2f,0 0 70px rgba(255,59,47,.6),0 30px 70px rgba(0,0,0,.7)}
.lab{position:absolute;font:700 46px Oswald;padding:2px 22px;border-radius:12px;text-transform:uppercase}
#la{left:60px;top:842px;background:#3a3f4b;transform:rotate(-6deg)}#lb{left:800px;top:900px;background:#E5342A;transform:rotate(4deg)}
#f{position:absolute;left:380px;top:1270px}
#sh{position:absolute;left:420px;top:1785px;width:300px;height:40px;border-radius:50%;background:rgba(0,0,0,.7);filter:blur(14px)}
</style><script src="../../../marca/pixel/pixel.js"></script><script src="../../../marca/pixel/pixel-figura.js"></script></head><body>
<div id="grid"></div><div id="hz"></div>
<div id="tag"><b>■</b> INNOVASITES · DISEÑO WEB</div>
<h1>Esta web<br><span class="r">no vendía</span></h1>
<div id="sub"><span>5 ajustes la cambiaron</span></div>
<img class="shot" id="a" src="a.png"><img class="shot" id="b" src="b.png">
<div class="lab" id="la">Antes</div><div class="lab" id="lb">Después</div>
<div id="sh"></div><div id="f"></div>
<script>
const fig = pixelFigura(document.getElementById('f'), 17); fig.cara({ eyes: 'star', mouth: 'grin' }); fig.pose({ brazoD: -165, brazoI: 150, cabeza: 4 });
[[70,600,26,0],[980,560,20,1],[120,1480,22,1],[930,1500,28,0],[60,800,16,1],[1000,820,18,0],[260,1300,14,1],[850,1320,18,1]].forEach(([x,y,s,w])=>{
 const d=document.createElement('div');d.className='cube'+(w?' w':'');Object.assign(d.style,{left:x+'px',top:y+'px',width:s+'px',height:s+'px',transform:`rotate(${x%40}deg)`});document.body.prepend(d)});
</script></body></html>
